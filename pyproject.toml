[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfn-drift-report"
version = "0.1.0"
description = "Turn AWS CloudFormation drift results into a readable report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = ["pytest>=7", "boto3>=1.28"]

[project.scripts]
cfn-drift-report = "cfn_drift_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
